name: Tests

on:
  push:
    branches:
      - lopputyotestaus
  pull_request:
    branches:
      - lopputyotestaus

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start app
        run: npm run dev -- --host 0.0.0.0 &

      - name: Run Cypress tests
        run: npx cypress run
